name: Apply Reliable OTA V2

on:
  push:
    branches:
      - fix-ota-progress-and-professional-ui
    paths:
      - frontend/PATCH_RELIABLE_OTA_V2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: fix-ota-progress-and-professional-ui
          fetch-depth: 0

      - name: Apply guarded updater migration
        working-directory: frontend
        run: node scripts/patch-reliable-ota-v2.mjs

      - name: Commit updater migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/AppUpdateGate.tsx
          git diff --cached --quiet && { echo "No updater changes produced"; exit 1; }
          git commit -m "Fix OTA progress and explicit apply flow"
          git push origin HEAD:fix-ota-progress-and-professional-ui
