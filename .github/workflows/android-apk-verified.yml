name: OnCampus Android APK 1.6.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/VERIFIED_APK_BUILD"

concurrency:
  group: oncampus-android-apk-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://oncampus-backend-production.up.railway.app/v1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      REACT_NATIVE_ARCHITECTURES: "arm64-v8a,x86_64"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Record release run start
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=frontend/VERIFIED_APK_STATUS.json
          printf '{"runId":%s,"status":"running","version":"1.6.2","sourceCommit":"%s","validation":"deterministic-no-emulator","startedAt":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/status.json
          CONTENT=$(base64 -w0 /tmp/status.json)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message="ci(android): 1.6.2 release run start" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message="ci(android): 1.6.2 release run start" -f content="$CONTENT" -f branch=main >/dev/null
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android build toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install SDK-pinned dependencies
        env:
          NODE_ENV: development
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: Validate startup contracts and release identity
        run: |
          set -euo pipefail
          node scripts/validate-release-startup.js
          VERSION=$(node -e "process.stdout.write(require('./app.json').expo.version)")
          RUNTIME=$(node -e "process.stdout.write(require('./app.json').expo.runtimeVersion)")
          CODE=$(node -e "process.stdout.write(String(require('./app.json').expo.android.versionCode))")
          test "$VERSION" = "1.6.2"
          test "$RUNTIME" = "1.6.2"
          test "$CODE" = "10602"
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "version_code=$CODE" >> "$GITHUB_ENV"

      - name: Typecheck entire application
        run: npx tsc --noEmit

      - name: Validate Expo native dependency graph
        run: |
          set -euo pipefail
          npx expo install --check
          node - <<'NODE'
          const expected={expo:'54.0.37','expo-asset':'12.0.13','expo-constants':'18.0.14','expo-audio':'1.1.1'};
          for(const [name,want] of Object.entries(expected)){
            const got=require(`${name}/package.json`).version;
            if(got!==want) throw new Error(`${name}: ${got} != ${want}`);
          }
          for(const name of ['expo-router','expo-updates','expo-notifications','react-native-gesture-handler','react-native-screens']) require.resolve(name);
          console.log('Expo/native dependency graph verified');
          NODE

      - name: Lint startup-critical application paths
        run: |
          npx eslint \
            app/_layout.tsx \
            app/index.tsx \
            src/theme/ThemeProvider.tsx \
            src/context/AccessibilityProvider.tsx \
            src/context/RoleProvider.tsx \
            src/components/AppErrorBoundary.tsx \
            src/components/OptionalFeatureBoundary.tsx

      - name: Export production Android bundle
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf /tmp/oncampus-export
          npx expo export --platform android --output-dir /tmp/oncampus-export
          test -d /tmp/oncampus-export
          find /tmp/oncampus-export -type f -maxdepth 4 -print | sort | tee export-files.txt
          test "$(find /tmp/oncampus-export -type f | wc -l)" -gt 3

      - name: Run Android release lint, unit-test task, and dependency resolution
        timeout-minutes: 45
        env:
          NODE_ENV: production
          APP_VERSION_NAME: "1.6.2"
          APP_VERSION_CODE: "10602"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dkotlin.compiler.execution.strategy=in-process"
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --stop || true
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath -PreactNativeArchitectures="$REACT_NATIVE_ARCHITECTURES" --no-daemon --console=plain > ../release-runtime-dependencies.txt
          ./gradlew :app:lintRelease :app:testReleaseUnitTest -PreactNativeArchitectures="$REACT_NATIVE_ARCHITECTURES" --no-daemon --no-parallel --max-workers=1 --console=plain --stacktrace

      - name: Build universal signed release APK
        timeout-minutes: 55
        env:
          NODE_ENV: production
          APP_VERSION_NAME: "1.6.2"
          APP_VERSION_CODE: "10602"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dkotlin.compiler.execution.strategy=in-process"
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures="$REACT_NATIVE_ARCHITECTURES" -Pandroid.enablePngCrunchInReleaseBuilds=false --no-daemon --no-parallel --max-workers=1 --build-cache --console=plain --stacktrace

      - name: Deep-validate exact APK artifact
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000000

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK" | tee apk-zipalign.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          unzip -t "$APK" | tee apk-zip-test.txt
          unzip -Z1 "$APK" | tee apk-files.txt

          grep -F "package: name='com.oncampus.app'" apk-badging.txt
          grep -F "versionCode='10602'" apk-badging.txt
          grep -F "versionName='1.6.2'" apk-badging.txt
          grep -F "launchable-activity: name='com.oncampus.app.MainActivity'" apk-badging.txt
          grep -F "lib/arm64-v8a/" apk-files.txt >/dev/null
          grep -F "lib/x86_64/" apk-files.txt >/dev/null
          ! grep -F "lib/armeabi-v7a/" apk-files.txt >/dev/null
          ! grep -F "lib/x86/" apk-files.txt >/dev/null
          grep -E '(^|/)assets/(index\.android\.bundle|.*\.hbc)$' apk-files.txt >/dev/null
          grep -F 'classes.dex' apk-files.txt >/dev/null

          BUNDLE=$(grep -E '(^|/)assets/(index\.android\.bundle|.*\.hbc)$' apk-files.txt | head -1)
          unzip -p "$APK" "$BUNDLE" > embedded-android-bundle.bin
          test "$(stat -c%s embedded-android-bundle.bin)" -gt 500000
          sha256sum "$APK" | tee OnCampus-1.6.2.apk.sha256

      - name: Prepare release package
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk OnCampus-1.6.2.apk
          printf 'package=com.oncampus.app\nversion=1.6.2\nruntimeVersion=1.6.2\nversionCode=10602\nabis=arm64-v8a,x86_64\nstartupProviderContract=passed\ntypecheck=passed\nexpoDependencyGraph=passed\nstartupLint=passed\nproductionExport=passed\ngradleLintRelease=passed\ngradleUnitTestTask=passed\napkSignature=passed\nzipalign=passed\napkArchiveIntegrity=passed\nembeddedBundle=passed\nemulator=skipped-by-request\n' > APK_INSTALL_INFO.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnCampus-1.6.2-Android
          path: |
            frontend/OnCampus-1.6.2.apk
            frontend/OnCampus-1.6.2.apk.sha256
            frontend/APK_INSTALL_INFO.txt
            frontend/apk-*.txt
            frontend/export-files.txt
            frontend/release-runtime-dependencies.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics and APK candidate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnCampus-1.6.2-Build-Diagnostics-${{ github.run_id }}
          path: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            frontend/apk-*.txt
            frontend/export-files.txt
            frontend/release-runtime-dependencies.txt
            frontend/android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.6.2
          name: OnCampus 1.6.2
          make_latest: true
          overwrite_files: true
          body: |
            OnCampus Android 1.6.2 startup recovery release.

            Fixed the production startup crash caused by ThemeProvider consuming AccessibilityContext before AccessibilityProvider existed. Storage/bootstrap paths now fail safe, and optional background coordinators are isolated from the primary navigation tree.

            Validation intentionally skips emulator execution. Release gates: startup provider contract, full TypeScript check, Expo native dependency compatibility, startup-critical lint, production Android export, Android lintRelease, Gradle unit-test task, signed universal APK build, signature verification, zipalign, package/version/activity metadata, ABI presence, ZIP integrity, and embedded production bundle checks.
          files: |
            frontend/OnCampus-1.6.2.apk
            frontend/OnCampus-1.6.2.apk.sha256
            frontend/APK_INSTALL_INFO.txt

      - name: Record release run result
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          FILE=frontend/VERIFIED_APK_STATUS.json
          printf '{"runId":%s,"status":"%s","version":"1.6.2","sourceCommit":"%s","validation":"deterministic-no-emulator","finishedAt":"%s"}\n' "$GITHUB_RUN_ID" "$BUILD_STATUS" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/status.json
          CONTENT=$(base64 -w0 /tmp/status.json)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message="ci(android): 1.6.2 release run $BUILD_STATUS" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message="ci(android): 1.6.2 release run $BUILD_STATUS" -f content="$CONTENT" -f branch=main >/dev/null
          fi
