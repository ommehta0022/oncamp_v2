name: Semantic Color Migration

on:
  push:
    branches: [semantic-theme-v1]
    paths:
      - '.github/workflows/semantic-color-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: semantic-theme-v1
          fetch-depth: 0
      - name: Apply business-semantic color mappings
        run: |
          python - <<'PY'
          from pathlib import Path

          def apply(path, pairs):
              p = Path(path)
              text = p.read_text()
              before = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == before:
                  raise SystemExit(f'{path}: no migration edits matched')
              p.write_text(text)

          apply('frontend/app/(auth)/login.tsx', [
            ('colors.luxuryGoldSoft', 'colors.brandTertiary'),
            ('color: colors.luxuryGold, fontWeight: "800"', 'color: colors.link, fontWeight: "800"'),
          ])
          apply('frontend/app/(tabs)/feed.tsx', [
            ('tintColor={colors.luxuryGold} colors={[colors.luxuryGold]}', 'tintColor={colors.actionPrimary} colors={[colors.actionPrimary]}'),
          ])
          apply('frontend/app/(tabs)/groups.tsx', [
            ('tintColor={colors.luxuryGold} colors={[colors.luxuryGold]}', 'tintColor={colors.actionPrimary} colors={[colors.actionPrimary]}'),
            ('backgroundColor: colors.luxuryGold }]}><Text style={styles.filterBadgeText}', 'backgroundColor: colors.tabBadge }]}><Text style={[styles.filterBadgeText, { color: colors.onTabBadge }]}'),
            ('backgroundColor: active ? colors.luxuryGold : "transparent"', 'backgroundColor: active ? colors.selectionStrong : "transparent"'),
            ('backgroundColor: colors.luxuryGoldSoft }]}><Ionicons name={error ? "cloud-offline-outline" : "people-outline"} size={28} color={colors.luxuryGold}', 'backgroundColor: colors.selectionSoft }]}><Ionicons name={error ? "cloud-offline-outline" : "people-outline"} size={28} color={colors.onSelectionSoft}'),
            ('color: colors.luxuryGold, fontSize: 10, fontWeight: "800"', 'color: colors.brandPrimary, fontSize: 10, fontWeight: "800"'),
            ('color={personalPinned ? colors.luxuryGold : colors.onSurfaceTertiary}', 'color={personalPinned ? colors.actionPrimary : colors.onSurfaceTertiary}'),
            ('backgroundColor: colors.luxuryGold }]}><Text style={styles.unreadText}', 'backgroundColor: colors.tabBadge }]}><Text style={[styles.unreadText, { color: colors.onTabBadge }]}'),
            ('filterBadgeText: { color: "#17130E",', 'filterBadgeText: {'),
            ('unreadText: { color: "#17130E",', 'unreadText: {'),
          ])
          apply('frontend/app/(tabs)/discover.tsx', [
            ('tintColor={colors.luxuryGold} colors={[colors.luxuryGold]}', 'tintColor={colors.actionPrimary} colors={[colors.actionPrimary]}'),
            ('backgroundColor: colors.luxuryGoldSoft }]}><Ionicons name="compass-outline" size={21} color={colors.luxuryGold}', 'backgroundColor: colors.brandTertiary }]}><Ionicons name="compass-outline" size={21} color={colors.onBrandTertiary}'),
            ('color: colors.luxuryGold, fontSize: 12, fontWeight: "800"', 'color: colors.link, fontSize: 12, fontWeight: "800"'),
            ('backgroundColor: colors.luxuryGoldSoft, alignItems: "center", justifyContent: "center" }}><Ionicons name="school-outline" size={size * .42} color={colors.luxuryGold}', 'backgroundColor: colors.brandTertiary, alignItems: "center", justifyContent: "center" }}><Ionicons name="school-outline" size={size * .42} color={colors.onBrandTertiary}'),
            ('color={colors.luxuryGold} /> : null}</View>', 'color={colors.actionPrimary} /> : null}</View>'),
            ('styles.typeText, { color: colors.luxuryGold }', 'styles.typeText, { color: colors.brandPrimary }'),
            ('color: colors.luxuryGold, fontSize: 9.5', 'color: colors.brandPrimary, fontSize: 9.5'),
            ('backgroundColor: colors.luxuryGoldSoft }]}><Ionicons name={icon} size={28} color={colors.luxuryGold}', 'backgroundColor: colors.selectionSoft }]}><Ionicons name={icon} size={28} color={colors.onSelectionSoft}'),
            ('backgroundColor: colors.luxuryGoldSoft }]}><Ionicons name={icon as any} size={22} color={colors.luxuryGold}', 'backgroundColor: colors.brandTertiary }]}><Ionicons name={icon as any} size={22} color={colors.onBrandTertiary}'),
          ])
          apply('frontend/app/(tabs)/notifications.tsx', [
            ('color: colors.luxuryGold, fontSize: font.sm, fontWeight: "800"', 'color: colors.link, fontSize: font.sm, fontWeight: "800"'),
            ('backgroundColor: active ? colors.luxuryGold : "transparent"', 'backgroundColor: active ? colors.selectionStrong : "transparent"'),
            ('  const badgeColor = n.type === "institution_post_request" ? colors.luxuryTeal : colors.luxuryGold;\n', '  const badge = n.type === "institution_post_request"\n    ? { bg: colors.info, fg: colors.onInfo }\n    : n.type === "announcement"\n      ? { bg: colors.announcement, fg: colors.onBrandSecondary }\n      : n.type === "approved"\n        ? { bg: colors.success, fg: colors.onSuccess }\n        : { bg: colors.actionPrimary, fg: colors.onActionPrimary };\n'),
            ('backgroundColor: badgeColor, borderColor: colors.surface', 'backgroundColor: badge.bg, borderColor: colors.surface'),
            ('size={11} color={colors.onBrandPrimary}', 'size={11} color={badge.fg}'),
            ('backgroundColor: colors.luxuryGold }]} />', 'backgroundColor: colors.tabBadge }]} />'),
          ])
          apply('frontend/app/(tabs)/profile.tsx', [
            ('checkmark-circle" size={19} color={colors.luxuryGold}', 'checkmark-circle" size={19} color={colors.actionPrimary}'),
            ('text={`${streak} day streak`} color={colors.luxuryGold}', 'text={`${streak} day streak`} color={colors.warning}'),
            ('<ActivityIndicator color={colors.luxuryGold}', '<ActivityIndicator color={colors.actionPrimary}'),
            ('backgroundColor: colors.luxuryGoldSoft }]}><Ionicons name={achievement.icon as any} size={22} color={achievement.earned === false ? colors.muted : colors.luxuryGold}', 'backgroundColor: colors.selectionSoft }]}><Ionicons name={achievement.icon as any} size={22} color={achievement.earned === false ? colors.muted : colors.actionPrimary}'),
            ('color: colors.luxuryGold, fontSize: font.base, fontWeight: "800"', 'color: colors.link, fontSize: font.base, fontWeight: "800"'),
            ('highlight ? colors.luxuryGold : colors.onSurface', 'highlight ? colors.warning : colors.onSurface'),
          ])
          apply('frontend/app/institution/dashboard.tsx', [
            ('title: "Public profile", subtitle: "Logo, cover and essential public details", route: "/institution/branding", color: colors.luxuryGold', 'title: "Public profile", subtitle: "Logo, cover and essential public details", route: "/institution/branding", color: colors.actionPrimary'),
            ('title: "Content", subtitle: "Create and manage official campus content", route: "/institution/content", color: colors.onSurface', 'title: "Content", subtitle: "Create and manage official campus content", route: "/institution/content", color: colors.actionSecondary'),
            ('title: "Student approvals", subtitle: pendingStudents ? `${pendingStudents} items need review` : "Review student access", route: "/institution/campus-platform", color: colors.luxuryGold', 'title: "Student approvals", subtitle: pendingStudents ? `${pendingStudents} items need review` : "Review student access", route: "/institution/campus-platform", color: pendingStudents ? colors.warning : colors.actionPrimary'),
            ('title: "Events", subtitle: "Create and update campus events", route: "/institution/campus-platform", color: colors.onSurface', 'title: "Events", subtitle: "Create and update campus events", route: "/institution/campus-platform", color: colors.actionSecondary'),
            ('title: "Analytics", subtitle: "View engagement and campus activity", route: "/institution/analytics", color: colors.luxuryGold', 'title: "Analytics", subtitle: "View engagement and campus activity", route: "/institution/analytics", color: colors.info'),
            ('backgroundColor: colors.luxuryGoldSoft, alignItems: "center", justifyContent: "center" }]}><Ionicons name="school-outline" size={27} color={colors.luxuryGold}', 'backgroundColor: colors.brandTertiary, alignItems: "center", justifyContent: "center" }]}><Ionicons name="school-outline" size={27} color={colors.onBrandTertiary}'),
            ('checkmark-circle" size={17} color={colors.luxuryGold}', 'checkmark-circle" size={17} color={colors.actionPrimary}'),
            ('backgroundColor: colors.luxuryGoldSoft }]}><Ionicons name="desktop-outline" size={23} color={colors.luxuryGold}', 'backgroundColor: `${colors.info}18` }]}><Ionicons name="desktop-outline" size={23} color={colors.info}'),
            ('backgroundColor: action.color === colors.luxuryGold ? colors.luxuryGoldSoft : colors.surfaceTertiary', 'backgroundColor: `${action.color}18`'),
          ])
          apply('frontend/app/settings/theme.tsx', [
            ('Warm ivory surfaces with charcoal type and champagne details.', 'Warm campus surfaces with moss identity and terracotta engagement accents.'),
            ('Near-black surfaces with soft ivory type and restrained champagne accents.', 'Deep neutral surfaces with accessible moss identity and terracotta engagement accents.'),
            ('borderColor: selected ? colors.luxuryGold : colors.borderStrong', 'borderColor: selected ? colors.actionPrimary : colors.borderStrong'),
            ('backgroundColor: colors.luxuryGold }]}', 'backgroundColor: colors.actionPrimary }]}'),
            ('borderColor: active ? colors.luxuryGold : c.border', 'borderColor: active ? colors.actionPrimary : c.border'),
            ('backgroundColor: c.luxuryGoldSoft', 'backgroundColor: c.brandTertiary'),
            ('backgroundColor: item === 0 ? c.luxuryGold : c.muted', 'backgroundColor: item === 0 ? c.tabActive : c.muted'),
            ('backgroundColor: option.key === "light" ? "#EFE8DC" : "#1A1916"', 'backgroundColor: option.key === "light" ? lightColors.brandTertiary : darkColors.brandTertiary'),
            ('color={option.key === "light" ? "#6D542B" : "#D7B66C"}', 'color={option.key === "light" ? lightColors.onBrandTertiary : darkColors.onBrandTertiary}'),
          ])
          apply('frontend/src/components/AppUpdateGate.tsx', [
            ('color: colors.luxuryGold }]}>{label}', 'color: state.phase === "error" ? colors.error : terminal ? colors.success : colors.info }]}>{label}'),
            ('colors={[colors.brandPrimary, colors.luxuryTeal]}', 'colors={[colors.actionPrimary, colors.success]}'),
            ('color: colors.luxuryTeal, fontWeight: "900"', 'color: colors.success, fontWeight: "900"'),
          ])

          validator = Path('frontend/scripts/validate-release-startup.js')
          text = validator.read_text()
          pairs = [
            ("expect(lightPalette.includes('surface: \"#FAF9F6\"'), 'light mode must keep the neutral pearl surface');", "expect(lightPalette.includes('surface: \"#FCFCF9\"'), 'light mode must match the oncampuses-v1 foundation surface');"),
            ("expect(lightPalette.includes('brandPrimary: \"#B38A4A\"') && lightPalette.includes('luxuryGold: \"#B38A4A\"'), 'light champagne accent contract missing');", "expect(lightPalette.includes('brandPrimary: \"#2E5C4E\"') && lightPalette.includes('brandSecondary: \"#E87A5D\"'), 'light moss/terracotta brand identity contract missing');"),
            ("expect(lightPalette.includes('luxuryTeal: \"#72806E\"'), 'light status sage accent missing');", "expect(lightPalette.includes('success: \"#2F7D5C\"') && lightPalette.includes('warning: \"#B7791F\"') && lightPalette.includes('error: \"#C04444\"') && lightPalette.includes('info: \"#4A788C\"'), 'light semantic state palette contract missing');"),
            ("expect(darkPalette.includes('surface: \"#080809\"'), 'dark mode must keep the neutral obsidian surface');", "expect(darkPalette.includes('surface: \"#151717\"'), 'dark mode must match the oncampuses-v1 foundation surface');"),
            ("expect(darkPalette.includes('card: \"#111112\"'), 'dark mode cards must remain neutral charcoal');", "expect(darkPalette.includes('card: \"#1C1F1E\"'), 'dark mode cards must match the reference neutral surface');"),
            ("expect(darkPalette.includes('brandPrimary: \"#C8A76B\"') && darkPalette.includes('luxuryGold: \"#C8A76B\"'), 'dark champagne accent contract missing');", "expect(darkPalette.includes('brandPrimary: \"#7FB19F\"') && darkPalette.includes('brandSecondary: \"#F0A48D\"'), 'dark moss/terracotta brand identity contract missing');"),
            ("expect(darkPalette.includes('luxuryTeal: \"#859481\"'), 'dark status sage accent missing');", "expect(darkPalette.includes('success: \"#6FC99E\"') && darkPalette.includes('warning: \"#E2B66A\"') && darkPalette.includes('error: \"#E27A7A\"') && darkPalette.includes('info: \"#82B1C2\"'), 'dark semantic state palette contract missing');"),
            ("expect(darkPalette.includes('gradientStart: \"#0B0A09\"') && darkPalette.includes('gradientEnd: \"#282119\"'), 'dark neutral gradient contract changed');", "for (const semanticToken of ['actionPrimary:', 'actionSecondary:', 'actionDanger:', 'tabActive:', 'tabBadge:', 'selectionStrong:', 'reactionActive:', 'announcement:']) { expect(lightPalette.includes(semanticToken) && darkPalette.includes(semanticToken), `semantic component token ${semanticToken} missing`); }"),
            ('with neutral luxury UI, resilient background OTA and durable Android APK downloads', 'with business-semantic reference UI, resilient background OTA and durable Android APK downloads'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'validator contract missing: {old[:70]}')
              text = text.replace(old, new)
          validator.write_text(text)

          audit = Path('frontend/scripts/audit-luxury-ui.js')
          text = audit.read_text()
          old = "    for (const match of text.matchAll(legacyHexes)) violations.push(`${rel}:${lineNumber(text, match.index)} legacy luxury color ${match[0]}`);"
          new = "    if (!rel.startsWith('android/')) for (const match of text.matchAll(legacyHexes)) violations.push(`${rel}:${lineNumber(text, match.index)} legacy luxury color ${match[0]}`);"
          if old not in text:
              raise SystemExit('audit native exemption matcher missing')
          audit.write_text(text.replace(old, new))
          PY
      - name: Confirm semantic migration
        run: node frontend/scripts/audit-luxury-ui.js
      - name: Commit semantic migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git diff --cached --quiet && exit 0
          git commit -m "Migrate remaining UI to business-semantic colors"
          git push origin HEAD:semantic-theme-v1
