name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish this APK as the latest GitHub release"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "frontend/RELEASE_BUILD"
  pull_request:
    branches: [main]
    paths:
      - "frontend/RELEASE_BUILD"

concurrency:
  group: oncampus-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      version: ${{ steps.app_version.outputs.version }}
      runtime: ${{ steps.app_version.outputs.runtime }}
      version_code: ${{ steps.app_version.outputs.version_code }}
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://oncampus-backend-production.up.railway.app/v1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Record APK build start
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=frontend/APK_BUILD_STATUS.json
          STATUS=$(printf '{\n  "runId": %s,\n  "runNumber": %s,\n  "sourceCommit": "%s",\n  "status": "running",\n  "startedAt": "%s"\n}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          CONTENT=$(printf '%s' "$STATUS" | base64 -w0)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message="ci(android): record APK build start" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message="ci(android): record APK build start" -f content="$CONTENT" -f branch=main >/dev/null
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install deterministic Android toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Validate native release identity
        id: app_version
        run: |
          set -euo pipefail
          VERSION=$(node -e "process.stdout.write(require('./app.json').expo.version)")
          RUNTIME=$(node -e "process.stdout.write(require('./app.json').expo.runtimeVersion)")
          VERSION_CODE=$(node -e "const c=require('./app.json').expo.android.versionCode; if(!Number.isInteger(c)||c<=150) process.exit(2); process.stdout.write(String(c))")
          EXPECTED_CODE=$(node -e "const p=require('./app.json').expo.version.split('.').map(Number); if(p.length!==3||p.some(n=>!Number.isInteger(n)||n<0||n>99)) process.exit(2); process.stdout.write(String(p[0]*10000+p[1]*100+p[2]))")
          NATIVE_RUNTIME=$(sed -n 's/.*name="expo_runtime_version"[^>]*>\([^<]*\)<.*/\1/p' android/app/src/main/res/values/strings.xml)
          MANIFEST_UPDATE_MODE=$(sed -n 's/.*EXPO_UPDATES_CHECK_ON_LAUNCH" android:value="\([^"]*\)".*/\1/p' android/app/src/main/AndroidManifest.xml)
          if [ "$VERSION_CODE" != "$EXPECTED_CODE" ]; then
            echo "Android versionCode $VERSION_CODE must match semantic version $VERSION as $EXPECTED_CODE" >&2
            exit 1
          fi
          if [ "$RUNTIME" != "$NATIVE_RUNTIME" ]; then
            echo "Runtime mismatch: app.json=$RUNTIME native=$NATIVE_RUNTIME" >&2
            exit 1
          fi
          if [ "$MANIFEST_UPDATE_MODE" != "NEVER" ]; then
            echo "Release startup must launch embedded code before remote OTA checks" >&2
            exit 1
          fi
          test -s android/app/debug.keystore
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building OnCampus $VERSION (versionCode $VERSION_CODE, runtime $RUNTIME)"

      - name: Install JavaScript dependencies including build tools
        env:
          NODE_ENV: development
        run: npm ci --include=dev --legacy-peer-deps

      - name: Verify Expo build dependency graph
        run: |
          set -euo pipefail
          node -e "require.resolve('babel-preset-expo'); require.resolve('@babel/core'); require.resolve('expo-router'); console.log('Expo/Babel build toolchain OK')"

      - name: Type-check release source
        run: npx tsc --noEmit

      - name: Run Expo project health checks
        run: npx expo-doctor

      - name: Preflight JavaScript bundle
        env:
          NODE_ENV: production
        run: npx expo export --platform android --output-dir /tmp/oncampus-expo-bundle

      - name: Build deterministic universal release APK
        timeout-minutes: 55
        env:
          NODE_ENV: production
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dkotlin.compiler.execution.strategy=in-process"
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --stop || true
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            -Pandroid.enablePngCrunchInReleaseBuilds=false \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            --build-cache \
            --console=plain \
            --stacktrace

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Validate APK signing, bundle and launch metadata
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          RUNTIME: ${{ steps.app_version.outputs.runtime }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ZIPALIGN" -c -v 4 "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          unzip -Z1 "$APK" > /tmp/apk-files.txt

          grep -F "package: name='com.oncampus.app'" /tmp/apk-badging.txt
          grep -F "versionCode='$VERSION_CODE'" /tmp/apk-badging.txt
          grep -F "versionName='$VERSION'" /tmp/apk-badging.txt
          grep -F "launchable-activity: name='com.oncampus.app.MainActivity'" /tmp/apk-badging.txt
          grep -F "lib/arm64-v8a/" /tmp/apk-files.txt >/dev/null
          grep -F "lib/x86_64/" /tmp/apk-files.txt >/dev/null
          grep -E '(^|/)assets/(index\.android\.bundle|.*\.hbc)$' /tmp/apk-files.txt >/dev/null

          CERT_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -1 | tr 'A-F' 'a-f')
          test -n "$CERT_SHA"

          PREVIOUS_CODE=$(node -e "try{const s=require('./APK_RELEASE_STATUS.json'); process.stdout.write(String(s.versionCode||0))}catch{process.stdout.write('0')}")
          PREVIOUS_CERT=$(node -e "try{const s=require('./APK_RELEASE_STATUS.json'); process.stdout.write(String(s.signingCertificateSha256||''))}catch{}")
          if [ "$PREVIOUS_CODE" -gt 0 ] && [ "$VERSION_CODE" -lt "$PREVIOUS_CODE" ]; then
            echo "Refusing downgrade: versionCode $VERSION_CODE is below published $PREVIOUS_CODE" >&2
            exit 1
          fi
          if [ -n "$PREVIOUS_CERT" ] && [ "$CERT_SHA" != "$PREVIOUS_CERT" ]; then
            echo "Refusing incompatible signature change; existing installs would fail to upgrade" >&2
            exit 1
          fi

          cat > APK_INSTALL_INFO.txt <<EOF
          package=com.oncampus.app
          version=$VERSION
          runtimeVersion=$RUNTIME
          versionCode=$VERSION_CODE
          abis=arm64-v8a,x86_64
          signingCertificateSha256=$CERT_SHA
          zipAlignment=verified
          embeddedBundle=verified
          launchActivity=com.oncampus.app.MainActivity
          EOF
          cat APK_INSTALL_INFO.txt

      - name: Enable KVM for Android emulator
        working-directory: ${{ github.workspace }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install and cold-launch exact release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/frontend/android/app/build/outputs/apk/release/app-release.apk"
            LOG="$GITHUB_WORKSPACE/frontend/android-smoke-logcat.txt"
            test -s "$APK"
            adb wait-for-device
            adb install -r "$APK"
            adb shell am force-stop com.oncampus.app
            adb logcat -c
            adb shell am start -W -n com.oncampus.app/.MainActivity | tee "$GITHUB_WORKSPACE/frontend/android-smoke-start.txt"
            sleep 12
            PID=$(adb shell pidof com.oncampus.app | tr -d '\r' || true)
            if [ -z "$PID" ]; then
              adb logcat -d > "$LOG" || true
              echo "OnCampus process exited during cold-start smoke test" >&2
              tail -n 250 "$LOG" >&2 || true
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F "com.oncampus.app/.MainActivity"
            adb logcat -d > "$LOG"
            if grep -E "FATAL EXCEPTION|Process: com\.oncampus\.app.*PID|Unable to start activity|ReactNativeJS.*(TypeError|ReferenceError|Invariant Violation|Error:)" "$LOG"; then
              echo "Fatal startup signature found in Android logcat" >&2
              exit 1
            fi
            echo "Release APK cold-start passed; process $PID remained alive."

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OnCampus.apk

      - name: Generate SHA-256
        run: sha256sum OnCampus.apk | tee OnCampus.apk.sha256

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnCampus-${{ steps.app_version.outputs.version }}-Android
          path: |
            frontend/OnCampus.apk
            frontend/OnCampus.apk.sha256
            frontend/APK_INSTALL_INFO.txt
            frontend/android-smoke-start.txt
            frontend/android-smoke-logcat.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnCampus-Android-build-diagnostics-${{ github.run_id }}
          path: |
            frontend/android/build/reports/
            frontend/android/app/build/reports/
            frontend/android/app/build/outputs/logs/
            frontend/android-smoke-start.txt
            frontend/android-smoke-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Record APK build result
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          FILE=frontend/APK_BUILD_STATUS.json
          STATUS=$(printf '{\n  "runId": %s,\n  "runNumber": %s,\n  "sourceCommit": "%s",\n  "status": "%s",\n  "finishedAt": "%s"\n}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$BUILD_STATUS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          CONTENT=$(printf '%s' "$STATUS" | base64 -w0)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message="ci(android): record APK build $BUILD_STATUS" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" -f message="ci(android): record APK build $BUILD_STATUS" -f content="$CONTENT" -f branch=main >/dev/null
          fi

  publish-release:
    needs: build-apk
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v5

      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: OnCampus-${{ needs.build-apk.outputs.version }}-Android
          path: release

      - name: Publish latest app release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-apk.outputs.version }}
          name: OnCampus ${{ needs.build-apk.outputs.version }}
          body_path: frontend/RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            release/OnCampus.apk
            release/OnCampus.apk.sha256
            release/APK_INSTALL_INFO.txt
            release/android-smoke-start.txt

      - name: Record verified APK release metadata
        env:
          VERSION: ${{ needs.build-apk.outputs.version }}
          RUNTIME: ${{ needs.build-apk.outputs.runtime }}
          VERSION_CODE: ${{ needs.build-apk.outputs.version_code }}
        run: |
          set -euo pipefail
          CHECKSUM=$(awk '{print $1}' release/OnCampus.apk.sha256)
          SIZE=$(stat -c%s release/OnCampus.apk)
          ABIS=$(awk -F= '/^abis=/{print $2}' release/APK_INSTALL_INFO.txt)
          CERT_SHA=$(awk -F= '/^signingCertificateSha256=/{print $2}' release/APK_INSTALL_INFO.txt)
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export CHECKSUM SIZE ABIS CERT_SHA PUBLISHED_AT
          node - <<'NODE'
          const fs = require('fs');
          const status = {
            version: process.env.VERSION,
            runtimeVersion: process.env.RUNTIME,
            versionCode: Number(process.env.VERSION_CODE),
            tag: `v${process.env.VERSION}`,
            apk: 'OnCampus.apk',
            sha256: process.env.CHECKSUM,
            size: Number(process.env.SIZE),
            abis: process.env.ABIS.split(','),
            signingCertificateSha256: process.env.CERT_SHA,
            installValidated: true,
            launchValidated: true,
            launchActivity: 'com.oncampus.app.MainActivity',
            publishedAt: process.env.PUBLISHED_AT,
            sourceCommit: process.env.GITHUB_SHA
          };
          fs.writeFileSync('/tmp/apk-status.json', JSON.stringify(status, null, 2) + '\n');
          NODE

      - name: Persist release status to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT=$(base64 -w0 /tmp/apk-status.json)
          EXISTING_SHA=$(gh api "repos/${{ github.repository }}/contents/frontend/APK_RELEASE_STATUS.json?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/frontend/APK_RELEASE_STATUS.json" \
              -f message="release(android): record verified OnCampus ${{ needs.build-apk.outputs.version }} APK" \
              -f content="$CONTENT" -f sha="$EXISTING_SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/frontend/APK_RELEASE_STATUS.json" \
              -f message="release(android): record verified OnCampus ${{ needs.build-apk.outputs.version }} APK" \
              -f content="$CONTENT" -f branch=main >/dev/null
          fi
