name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://oncampus-backend-production.up.railway.app/v1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read app version
        id: app_version
        run: echo "version=$(node -p \"require('./app.json').expo.version\")" >> "$GITHUB_OUTPUT"

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps

      - name: Preflight JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/oncampus-expo-bundle

      - name: Build release APK
        env:
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OnCampus.apk

      - name: Generate SHA-256
        run: sha256sum OnCampus.apk | tee OnCampus.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnCampus-${{ steps.app_version.outputs.version }}-Android
          path: |
            frontend/OnCampus.apk
            frontend/OnCampus.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest app release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: OnCampus ${{ steps.app_version.outputs.version }}
          body_path: frontend/RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            frontend/OnCampus.apk
            frontend/OnCampus.apk.sha256
