name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish this APK as the latest GitHub release"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "frontend/RELEASE_BUILD"
  pull_request:
    branches: [main]
    paths:
      - "frontend/RELEASE_BUILD"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      version: ${{ steps.app_version.outputs.version }}
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://oncampus-backend-production.up.railway.app/v1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4096m"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(node -e "process.stdout.write(require('./app.json').expo.version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check release source
        run: npx tsc --noEmit

      - name: Preflight JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/oncampus-expo-bundle

      - name: Build release APK
        timeout-minutes: 42
        env:
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --stop || true
          timeout 40m ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2 --build-cache --stacktrace --console=plain -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OnCampus.apk

      - name: Generate SHA-256
        run: sha256sum OnCampus.apk | tee OnCampus.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnCampus-${{ steps.app_version.outputs.version }}-Android
          path: |
            frontend/OnCampus.apk
            frontend/OnCampus.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build-apk
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: OnCampus-${{ needs.build-apk.outputs.version }}-Android
          path: release

      - name: Publish latest app release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-apk.outputs.version }}
          name: OnCampus ${{ needs.build-apk.outputs.version }}
          body_path: frontend/RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            release/OnCampus.apk
            release/OnCampus.apk.sha256
