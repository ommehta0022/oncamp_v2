name: Finalize OTA and Installer 1.6.7

on:
  push:
    branches: [ota-installer-final-1.6.7]
    paths:
      - '.github/workflows/ota-installer-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ota-installer-final-1.6.7
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply final OTA and installer fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('frontend')

          # Native baseline identity and controlled-update configuration.
          app_path = root / 'app.json'
          app = json.loads(app_path.read_text())
          expo = app['expo']
          expo['version'] = '1.6.7'
          expo['runtimeVersion'] = '1.6.7'
          expo['android']['versionCode'] = 10607
          expo['updates']['checkAutomatically'] = 'NEVER'
          expo['extra']['otaRuntimeVersion'] = '1.6.7'
          app_path.write_text(json.dumps(app, indent=2) + '\n')

          p = root / 'android/app/build.gradle'
          text = p.read_text().replace('?: "1.6.6"', '?: "1.6.7"').replace('?: "10606"', '?: "10607"')
          p.write_text(text)

          p = root / 'android/app/src/main/res/values/strings.xml'
          p.write_text(p.read_text().replace('>1.6.6</string>', '>1.6.7</string>'))

          p = root / 'android/app/src/main/AndroidManifest.xml'
          text = p.read_text()
          text = text.replace('EXPO_UPDATES_CHECK_ON_LAUNCH" android:value="ALWAYS"', 'EXPO_UPDATES_CHECK_ON_LAUNCH" android:value="NEVER"')
          anchor = '    <activity android:name=".MainActivity"'
          restart = '    <activity android:name=".OnCampusOtaRestartActivity" android:exported="false" android:process=":ota_restart" android:excludeFromRecents="true" android:theme="@android:style/Theme.Translucent.NoTitleBar"/>\n'
          if restart not in text:
              if anchor not in text: raise SystemExit('MainActivity manifest anchor missing')
              text = text.replace(anchor, restart + anchor)
          p.write_text(text)

          (root / 'DIRECT_APK_BUILD').write_text(
              'version=1.6.7\nruntime=1.6.7\nversionCode=10607\nmode=direct-signed-apk\nrequested=2026-08-27T10:15:00+05:30\nsource=ota-installer-final\nskipColdLaunch=true\n'
          )

          # Stop using checkForUpdateAsync entirely. The signed production status
          # endpoint is authoritative for discovery; expo-updates only fetches.
          p = root / 'src/updates/backgroundOta.ts'
          text = p.read_text()
          pattern = re.compile(r'async function fetchUpdateWithRetry\(expectedUpdateId: string\) \{.*?\n\}\n\nasync function runPrefetch', re.S)
          replacement = '''async function fetchUpdateWithRetry(expectedUpdateId: string) {
            let lastError: unknown = null;

            for (let attempt = 0; attempt < FETCH_ATTEMPTS; attempt += 1) {
              try {
                const fetched = await Updates.fetchUpdateAsync();
                const manifestId = String((fetched as any)?.manifest?.id || expectedUpdateId || "pending");
                if (expectedUpdateId && manifestId && manifestId !== expectedUpdateId) {
                  throw new Error(`OTA changed during download (${manifestId} != ${expectedUpdateId})`);
                }

                // isNew=false is valid when expo-updates already cached the exact
                // signed update. The production pointer still differs from the
                // running update, so a cold restart can activate the cached copy.
                if (fetched.isNew || expectedUpdateId !== String(Updates.updateId || "")) {
                  await persistReady(expectedUpdateId || manifestId);
                  return true;
                }
                return false;
              } catch (error) {
                lastError = error;
                if (attempt < FETCH_ATTEMPTS - 1) await sleep(800 * 2 ** attempt);
              }
            }

            await persistFailure(lastError);
            return false;
          }

          async function runPrefetch'''
          text, n = pattern.subn(replacement, text)
          if n != 1: raise SystemExit(f'background OTA fetch block replacement count={n}')
          if 'Updates.checkForUpdateAsync()' in text: raise SystemExit('checkForUpdateAsync remains in background OTA')
          p.write_text(text)

          # App update gate: server ID discovery, no rejected Expo check, isolated
          # cold restart for OTA activation, and faster foreground discovery.
          p = root / 'src/components/AppUpdateGate.tsx'
          text = p.read_text()
          text = text.replace('const AUTOMATIC_CHECK_INTERVAL_MS = 10 * 60 * 1000;', 'const AUTOMATIC_CHECK_INTERVAL_MS = 60 * 1000;')
          text = text.replace('  startInstall: (url: string, sha256: string) => Promise<NativeInstallerResult>;\n', '  startInstall: (url: string, sha256: string) => Promise<NativeInstallerResult>;\n  restartForOta: () => Promise<NativeInstallerResult>;\n')

          old_server = '''async function serverOtaId() {
            const runtime = currentRuntime();
            if (!runtime) return null;
            try {
              const response = await fetch(`${API_BASE}/updates/status?runtimeVersion=${encodeURIComponent(runtime)}`, {
                headers: { Accept: "application/json", "Cache-Control": "no-cache" },
              });
              if (!response.ok) return null;
              const payload = await response.json() as { releaseAvailable?: boolean; updateId?: string | null };
              return payload.releaseAvailable && payload.updateId ? String(payload.updateId) : null;
            } catch {
              return null;
            }
          }'''
          new_server = '''async function serverOtaId(strict = false) {
            const runtime = currentRuntime();
            if (!runtime) {
              if (strict) throw new Error("This installation has no OTA runtime identity.");
              return null;
            }
            try {
              const response = await fetch(`${API_BASE}/updates/status?runtimeVersion=${encodeURIComponent(runtime)}`, {
                headers: { Accept: "application/json", "Cache-Control": "no-cache" },
              });
              if (!response.ok) throw new Error(`Update service returned ${response.status}`);
              const payload = await response.json() as { releaseAvailable?: boolean; updateId?: string | null };
              return payload.releaseAvailable && payload.updateId ? String(payload.updateId) : null;
            } catch (error) {
              if (strict) throw new Error("Couldn’t reach the OnCampus update service. Check your connection and try again.");
              return null;
            }
          }'''
          if old_server not in text: raise SystemExit('serverOtaId block changed')
          text = text.replace(old_server, new_server)

          pattern = re.compile(r'async function checkForOtaUpdate\(mode: UpdateCheckMode\): Promise<boolean> \{.*?\n\}\n\nasync function markOtaApply', re.S)
          replacement = '''async function checkForOtaUpdate(mode: UpdateCheckMode): Promise<boolean> {
            if (Platform.OS !== "android" || !Updates.isEnabled) return false;
            if (await showDownloadedPending(mode)) return true;

            // The runtime-specific production control plane is the discovery
            // authority. This avoids the rejected checkForUpdateAsync promise
            // that could suppress both manual checks and automatic prompts.
            const serverId = await serverOtaId(mode === "manual");
            if (!serverId || serverId === currentUpdateId()) return false;
            const releaseKey = `ota:${serverId}`;

            void prefetchLatestOta(true).catch(() => undefined);
            if (await isDeferred(releaseKey, mode)) return true;

            pendingOtaReleaseKey = releaseKey;
            emitUpdateUi({
              kind: "ota",
              phase: "available",
              progress: 0,
              releaseKey,
              message: "A new OnCampus update is ready",
              detail: "The signed production update is compatible with this runtime. Download starts immediately and Android can continue retrying if you minimize OnCampus.",
            });
            return true;
          }

          async function markOtaApply'''
          text, n = pattern.subn(replacement, text)
          if n != 1: raise SystemExit(f'checkForOtaUpdate replacement count={n}')

          old_reload = '''  await new Promise((resolve) => setTimeout(resolve, 120));
            await Updates.reloadAsync();
            return true;'''
          new_reload = '''  await new Promise((resolve) => setTimeout(resolve, 120));
            if (!nativeInstaller?.restartForOta) {
              emitUpdateUi({ kind: "ota", phase: "error", progress: 100, releaseKey, message: "Update downloaded", detail: "The secure restart bridge is unavailable. Close OnCampus completely and reopen it to apply the downloaded update." });
              return false;
            }
            await nativeInstaller.restartForOta();
            return true;'''
          if old_reload not in text: raise SystemExit('reloadReadyOta body changed')
          text = text.replace(old_reload, new_reload)
          text = text.replace('timer = setTimeout(() => { void checkForAppUpdate("automatic"); }, 2200);', 'timer = setTimeout(() => { void checkForAppUpdate("automatic"); }, 900);')
          text = text.replace('                : "Keep OnCampus open until the Android installer starts."}', '                : "You can minimize OnCampus while Android downloads the APK. Return to OnCampus after it finishes and the verified Android installer will open automatically."}')
          if 'Updates.checkForUpdateAsync()' in text: raise SystemExit('checkForUpdateAsync remains in AppUpdateGate')
          p.write_text(text)

          # Campaign delivery must retry transient failures instead of marking a
          # campaign seen before the update UI successfully handles it.
          p = root / 'src/components/ServerUpdateCoordinator.tsx'
          text = p.read_text()
          text = text.replace('let currentCampaignInMemory: string | null = null;\nlet currentCampaignTargetInMemory: string | null = null;\nlet currentNativeReleaseInMemory: string | null = null;\n', '')
          old_native = '''    if (campaign.nativeUpdateAvailable && campaign.nativeReleaseVersion) {
              if (campaign.nativeReleaseVersion !== currentNativeReleaseInMemory) {
                currentNativeReleaseInMemory = campaign.nativeReleaseVersion;
                await checkForAppUpdate("campaign", true, true);
              }
              return nextPollSeconds;
            }

            if (!campaign.available || !campaign.campaignId) return nextPollSeconds;

            const target = `${runtime}|${currentUpdateId}`;
            if (currentCampaignTargetInMemory === target && currentCampaignInMemory === campaign.campaignId) {
              return nextPollSeconds;
            }
            currentCampaignTargetInMemory = target;
            currentCampaignInMemory = campaign.campaignId;

            await checkForAppUpdate("campaign", true, true);
            return nextPollSeconds;'''
          new_native = '''    if (campaign.nativeUpdateAvailable || (campaign.available && campaign.campaignId)) {
              // Do not mark campaigns handled in memory before the update UI has
              // succeeded. Re-check each server poll so a transient network/native
              // promise problem cannot suppress the prompt for the whole session.
              await checkForAppUpdate("campaign", true, true);
            }
            return nextPollSeconds;'''
          if old_native not in text: raise SystemExit('campaign dedupe block changed')
          text = text.replace(old_native, new_native)
          p.write_text(text)

          # Native bridge: true process-cold restart for OTA and safer verified APK
          # installer handoff. Android still owns the final user confirmation.
          p = root / 'android/app/src/main/java/com/oncampus/app/OnCampusApkInstallerModule.kt'
          text = p.read_text()
          text = text.replace('import android.os.Environment\n', 'import android.os.Environment\nimport android.os.Handler\nimport android.os.Looper\nimport android.os.Process\n')
          anchor = '  private fun canInstallPackages(): Boolean {'
          restart_method = '''  @ReactMethod
            fun restartForOta(promise: Promise) {
              if (!hostResumed) {
                promise.reject("APP_NOT_ACTIVE", "OnCampus must be active to apply the downloaded update")
                return
              }
              try {
                val intent = Intent(reactContext, OnCampusOtaRestartActivity::class.java).apply {
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_NO_ANIMATION)
                }
                reactContext.runOnUiQueueThread {
                  try {
                    reactContext.startActivity(intent)
                    promise.resolve(Arguments.createMap().apply { putString("status", "restarting") })
                    Handler(Looper.getMainLooper()).postDelayed({
                      Process.killProcess(Process.myPid())
                    }, 180L)
                  } catch (error: Exception) {
                    promise.reject("OTA_RESTART_FAILED", error.message ?: "Unable to restart OnCampus", error)
                  }
                }
              } catch (error: Exception) {
                promise.reject("OTA_RESTART_FAILED", error.message ?: "Unable to restart OnCampus", error)
              }
            }

          '''
          if 'fun restartForOta(' not in text:
              if anchor not in text: raise SystemExit('installer restart insertion anchor missing')
              text = text.replace(anchor, restart_method + anchor)
          text = text.replace('setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE)', 'setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)')
          text = text.replace('    launchInstaller(apkFile)\n    clearPendingMetadata()\n', '    launchInstaller(apkFile)\n')
          old_launch = '''  private fun launchInstaller(apkFile: File) {
            val uri = FileProvider.getUriForFile(
              reactContext,
              "${reactContext.packageName}.apkprovider",
              apkFile
            )
            val intent = Intent(Intent.ACTION_VIEW).apply {
              setDataAndType(uri, "application/vnd.android.package-archive")
              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            }
            reactContext.runOnUiQueueThread {
              reactContext.startActivity(intent)
            }
          }'''
          new_launch = '''  private fun launchInstaller(apkFile: File) {
            val uri = FileProvider.getUriForFile(
              reactContext,
              "${reactContext.packageName}.apkprovider",
              apkFile
            )
            val intent = Intent(Intent.ACTION_VIEW).apply {
              setDataAndType(uri, "application/vnd.android.package-archive")
              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP)
            }
            if (intent.resolveActivity(reactContext.packageManager) == null) {
              emit("error", 100, "Android installer unavailable", "The APK is downloaded and verified, but Android could not resolve its package installer.")
              return
            }
            reactContext.runOnUiQueueThread {
              try {
                reactContext.startActivity(intent)
                // Clear only after Android accepted the installer intent. If the
                // handoff throws, verified metadata remains so the user can retry.
                clearPendingMetadata()
              } catch (error: Exception) {
                emit("error", 100, "Android installer could not open", error.message ?: "Return to OnCampus and try Install now again.")
              }
            }
          }'''
          if old_launch not in text: raise SystemExit('installer launch block changed')
          text = text.replace(old_launch, new_launch)
          p.write_text(text)

          # Release contracts now enforce the fixed architecture.
          p = root / 'scripts/validate-release-startup.js'
          text = p.read_text()
          text = text.replace("expect(app.updates?.checkAutomatically === 'ON_LOAD', 'Expo Updates must check natively on every cold launch');", "expect(app.updates?.checkAutomatically === 'NEVER', 'Expo native startup checks must be disabled so the server coordinator owns discovery without concurrent promise races');")
          text = text.replace("expect(manifest.includes('EXPO_UPDATES_CHECK_ON_LAUNCH\" android:value=\"ALWAYS\"'), 'native manifest must enable automatic Expo update checks');", "expect(manifest.includes('EXPO_UPDATES_CHECK_ON_LAUNCH\" android:value=\"NEVER\"'), 'native manifest must disable concurrent startup update checks');")
          text = text.replace("expect(updateGate.includes('Updates.reloadAsync()'), 'OTA one-tap apply/reload step missing');", "expect(updateGate.includes('restartForOta'), 'OTA one-tap cold-restart activation bridge missing');\nexpect(!updateGate.includes('Updates.checkForUpdateAsync()'), 'update gate must not depend on rejected Expo check promises');")
          text = text.replace("expect(!backgroundOta.includes('Updates.reloadAsync()'), 'background OTA worker must never reload the hidden app');", "expect(!backgroundOta.includes('Updates.reloadAsync()'), 'background OTA worker must never reload the hidden app');\nexpect(!backgroundOta.includes('Updates.checkForUpdateAsync()'), 'background OTA must use server discovery and direct signed fetch');")
          text = text.replace("expect(apkInstaller.includes('override fun onHostResume()'), 'native APK updater must resume verification/install when app returns');", "expect(apkInstaller.includes('override fun onHostResume()'), 'native APK updater must resume verification/install when app returns');\nexpect(apkInstaller.includes('restartForOta') && apkInstaller.includes('OnCampusOtaRestartActivity'), 'isolated OTA cold-restart bridge missing');\nexpect(apkInstaller.includes('VISIBILITY_VISIBLE_NOTIFY_COMPLETED'), 'DownloadManager must notify when a background APK download completes');\nexpect(manifest.includes('android:name=\".OnCampusOtaRestartActivity\"') && manifest.includes('android:process=\":ota_restart\"'), 'isolated OTA restart activity manifest contract missing');")
          text = text.replace('with business-semantic reference UI, resilient background OTA and durable Android APK downloads', 'with server-driven OTA discovery, isolated cold-restart activation and verified Android installer handoff')
          p.write_text(text)
          PY
      - name: Install locked mobile dependencies
        working-directory: frontend
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Validate final update contracts
        working-directory: frontend
        run: |
          node scripts/audit-luxury-ui.js
          node scripts/validate-release-startup.js
          npx expo install --check
          npx tsc --noEmit
          npx expo export --platform android --output-dir /tmp/oncampus-android-export
      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git diff --cached --quiet && exit 0
          git commit -m "Fix OTA discovery and Android installer flow for 1.6.7"
          git push origin HEAD:ota-installer-final-1.6.7
