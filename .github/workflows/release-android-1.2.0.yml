name: Release OnCampus Android 1.2.0 OTA Baseline

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/release-android-1.2.0.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/release-android-1.2.0.yml"

permissions:
  contents: read

concurrency:
  group: release-android-1.2.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  announce:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record running release
        run: |
          mkdir -p .github
          cat > .github/release-android-1.2.0-status.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "head_sha": "${{ github.sha }}",
            "build": "running",
            "publish": "pending"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-android-1.2.0-status.json
          git diff --cached --quiet || git commit -m "Record running Android 1.2.0 release"
          git push

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://oncampus-backend-production.up.railway.app/v1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Verify release identity
        run: |
          set -euo pipefail
          VERSION=$(node -e 'process.stdout.write(String(require("./app.json").expo.version))')
          RUNTIME=$(node -e 'process.stdout.write(String(require("./app.json").expo.runtimeVersion))')
          test "$VERSION" = "1.2.0"
          test "$RUNTIME" = "1.2.0"
          grep -q 'expo.modules.updates.ENABLED.*true' android/app/src/main/AndroidManifest.xml
          grep -q 'expo.modules.updates.EXPO_UPDATE_URL' android/app/src/main/AndroidManifest.xml
          grep -q 'expo.modules.updates.CODE_SIGNING_CERTIFICATE' android/app/src/main/AndroidManifest.xml
          grep -q 'oncampus-main' android/app/src/main/AndroidManifest.xml

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Production dependency critical audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Validate Expo Android export
        run: npx expo export --platform android --output-dir /tmp/oncampus-1.2.0-export

      - name: Build release APK
        env:
          APP_VERSION_NAME: "1.2.0"
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --build-cache --parallel --console=plain -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Verify and checksum APK
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk OnCampus.apk
          sha256sum OnCampus.apk | tee OnCampus.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OnCampus-1.2.0-OTA-Baseline
          path: |
            frontend/OnCampus.apk
            frontend/OnCampus.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OnCampus-1.2.0-OTA-Baseline
          path: release
      - name: Publish OnCampus 1.2.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.2.0
          name: OnCampus 1.2.0
          body_path: frontend/RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            release/OnCampus.apk
            release/OnCampus.apk.sha256

  report:
    needs: [build, publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record release run status
        run: |
          mkdir -p .github
          cat > .github/release-android-1.2.0-status.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "head_sha": "${{ github.sha }}",
            "build": "${{ needs.build.result }}",
            "publish": "${{ needs.publish.result }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-android-1.2.0-status.json
          git diff --cached --quiet || git commit -m "Record Android 1.2.0 release status"
          git push
