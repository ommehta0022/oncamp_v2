name: Professional UI Cleanup

on:
  push:
    branches:
      - professional-ui-1.6.7
    paths:
      - .github/workflows/professional-ui-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: professional-ui-1.6.7
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Replace rejected legacy blue literals by semantic role
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('frontend/app/(tabs)/discover.tsx'): {
                  '#0B1947': '#181A19',
              },
              Path('frontend/src/components/AppErrorBoundary.tsx'): {
                  '#F8FAFD': '#F9F8F6',
                  '#EAF2FF': '#E7EFEA',
                  '#1267F4': '#2E5C4E',
                  '#0B1947': '#181A19',
                  '#64708E': '#4A4D4C',
                  '#8A95AD': '#8A8D8B',
              },
              Path('frontend/src/screens/InstitutionProfileV2.tsx'): {
                  '#0B1947': '#181A19',
                  '#DCE9FF': '#E7EFEA',
              },
          }

          for path, mapping in replacements.items():
              source = path.read_text(encoding='utf-8')
              original = source
              for old, new in mapping.items():
                  source = source.replace(old, new)
              if source == original:
                  raise SystemExit(f'Expected professional UI cleanup did not change {path}')
              path.write_text(source, encoding='utf-8')

          rejected = ('#1267F4', '#0B4BC2', '#7B3FF2', '#0D4FC4', '#EAF2FF', '#0B1947')
          remaining = []
          for root in (Path('frontend/app'), Path('frontend/src')):
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx', '.js', '.jsx'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for token in rejected:
                      if token.lower() in text.lower():
                          remaining.append(f'{path}: {token}')
          if remaining:
              raise SystemExit('Rejected blue tokens remain:\n' + '\n'.join(remaining))
          PY
      - name: Install locked mobile dependencies
        working-directory: frontend
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Validate professional UI and TypeScript
        working-directory: frontend
        run: |
          node scripts/audit-luxury-ui.js
          node scripts/validate-release-startup.js
          npx tsc --noEmit
      - name: Commit exact cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/app/'(tabs)'/discover.tsx frontend/src/components/AppErrorBoundary.tsx frontend/src/screens/InstitutionProfileV2.tsx
          git commit -m "Remove remaining legacy blue UI literals"
          git push origin HEAD:professional-ui-1.6.7
