name: Neutral UI Source Fix

on:
  push:
    branches: [luxury-neutral-1.6.6]
    paths:
      - '.github/workflows/neutral-ui-source-fix.yml'
      - 'frontend/src/screens/InstitutionProfileV2.tsx'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: luxury-neutral-1.6.6
      - name: Remove remaining blue literals from institution profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/screens/InstitutionProfileV2.tsx')
          s = p.read_text()
          replacements = {
              '#0B1947': '#171512',
              '#DCE9FF': '#ECE6DC',
              '#C7CFDE': '#D8D2C7',
              'rgba(7,20,54,0.10)': 'rgba(0,0,0,0.08)',
              'rgba(5,17,48,0.55)': 'rgba(0,0,0,0.58)',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit neutral source cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/screens/InstitutionProfileV2.tsx
          git commit -m "Neutralize institution profile hardcoded colors"
          git push origin HEAD:luxury-neutral-1.6.6
