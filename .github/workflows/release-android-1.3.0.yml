name: Release OnCampus Android 1.3.0 Server Update Baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/release-android-1.3.0-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-android-1.3.0
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://oncampus-backend-production.up.railway.app/v1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Verify 1.3.0 native/update identity
        run: |
          set -euo pipefail
          VERSION=$(node -e 'process.stdout.write(String(require("./app.json").expo.version))')
          RUNTIME=$(node -e 'process.stdout.write(String(require("./app.json").expo.runtimeVersion))')
          test "$VERSION" = "1.3.0"
          test "$RUNTIME" = "1.3.0"
          grep -q 'expo.modules.updates.ENABLED.*true' android/app/src/main/AndroidManifest.xml
          grep -q 'expo.modules.updates.EXPO_UPDATE_URL' android/app/src/main/AndroidManifest.xml
          grep -q 'expo.modules.updates.CODE_SIGNING_CERTIFICATE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q '>1.3.0<' android/app/src/main/res/values/strings.xml
          grep -q 'oncampus-main' android/app/src/main/AndroidManifest.xml
          test -s android/app/google-services.json
          node -e 'const p=require("./package.json"); if(!p.dependencies["expo-notifications"]||!p.dependencies["expo-updates"]) process.exit(1)'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Production dependency critical audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Validate Expo Android export
        run: npx expo export --platform android --output-dir /tmp/oncampus-1.3.0-export

      - name: Build release APK safely
        timeout-minutes: 38
        env:
          APP_VERSION_NAME: "1.3.0"
          APP_VERSION_CODE: "130"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4096m"
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --stop || true
          if ! timeout 36m ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2 --build-cache --stacktrace --console=plain -PreactNativeArchitectures=armeabi-v7a,arm64-v8a 2>&1 | tee /tmp/oncampus-1.3.0-gradle.log; then
            echo "Gradle release build failed or timed out. Diagnostics:"
            tail -n 300 /tmp/oncampus-1.3.0-gradle.log || true
            df -h || true
            free -h || true
            java -version || true
            exit 1
          fi

      - name: Verify APK and checksum
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk OnCampus.apk
          sha256sum OnCampus.apk | tee OnCampus.apk.sha256
          test -s OnCampus.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OnCampus-1.3.0-Server-Update-Baseline
          path: |
            frontend/OnCampus.apk
            frontend/OnCampus.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OnCampus-1.3.0-Server-Update-Baseline
          path: release
      - name: Publish OnCampus 1.3.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.3.0
          name: OnCampus 1.3.0
          body_path: frontend/RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            release/OnCampus.apk
            release/OnCampus.apk.sha256
