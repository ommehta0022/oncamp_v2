name: Apply OTA Progress Fix V2

on:
  push:
    branches: [ota-progress-reliability-1.6.8]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_API_URL: https://oncampus-backend-production.up.railway.app/v1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ota-progress-reliability-1.6.8
          fetch-depth: 0
      - name: Stop after product patch exists
        id: guard
        run: |
          if [ -f frontend/OTA_PROGRESS_BASELINE ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.done != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded changes
        if: steps.guard.outputs.done != 'true'
        run: python .github/scripts/apply_ota_progress_fix.py
      - name: Install locked dependencies
        if: steps.guard.outputs.done != 'true'
        working-directory: frontend
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Validate updater and restored UI
        if: steps.guard.outputs.done != 'true'
        working-directory: frontend
        run: |
          node scripts/audit-luxury-ui.js
          node scripts/validate-release-startup.js
          npx expo install --check
          npx tsc --noEmit
          rm -rf /tmp/oncampus-android-export
          NODE_ENV=production npx expo export --platform android --output-dir /tmp/oncampus-android-export
          test -s /tmp/oncampus-android-export/metadata.json
      - name: Commit validated product patch
        if: steps.guard.outputs.done != 'true'
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "[ota-fix-applied] OnCampus 1.6.8 reliable OTA progress and apply"
          git push origin HEAD:ota-progress-reliability-1.6.8
