name: Publish OnCampus OTA Update

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "production_server.py"
      - "ota_updates.py"
      - ".github/workflows/ota-update.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "production_server.py"
      - "ota_updates.py"
      - ".github/workflows/ota-update.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: oncampus-ota-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      runtime: ${{ steps.runtime.outputs.runtime }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: scope
        name: Classify update safety
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs are never an unconditional OTA escape hatch. Classify
            # the exact latest commit with the same native-safety rules.
            git diff --name-only "HEAD^" HEAD > /tmp/changed.txt
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="${AFTER}^"
            fi
            git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed.txt
          fi
          cat /tmp/changed.txt

          if grep -Eq '^frontend/(android/|ios/|package\.json$|package-lock\.json$|app\.json$|babel\.config\.|metro\.config\.|plugins/|certs/)' /tmp/changed.txt; then
            echo "Native/runtime-sensitive change detected; OTA intentionally skipped."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Delivery-layer changes can break or repair whether an existing APK
          # can consume an OTA, so they must run the same full package + live
          # verification pipeline as an app JS change.
          if grep -Eq '^frontend/(app/|src/|assets/|components/|constants/|hooks/|lib/|utils/)|^production_server\.py$|^ota_updates\.py$|^\.github/workflows/ota-update\.yml$' /tmp/changed.txt; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No OTA-deliverable app or delivery-contract change detected."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - id: runtime
        name: Read runtime version
        working-directory: frontend
        shell: bash
        run: |
          VERSION=$(node -e "process.stdout.write(String(require('./app.json').expo.runtimeVersion))")
          echo "runtime=$VERSION" >> "$GITHUB_OUTPUT"

  package:
    needs: classify
    if: needs.classify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://oncampus-backend-production.up.railway.app/v1"
      OTA_API_BASE: "https://oncampus-backend-production.up.railway.app/v1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact locked dependencies
        working-directory: frontend
        env:
          NODE_ENV: development
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: Validate OTA source contracts
        working-directory: frontend
        run: |
          set -euo pipefail
          node scripts/validate-release-startup.js
          npx tsc --noEmit
          npx expo install --check

      - name: Export Android JS and assets
        working-directory: frontend
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf ota-dist ota-release
          npx expo export --platform android --output-dir ota-dist
          npx expo config --type public --json > ota-dist/expoConfig.json
          test -s ota-dist/metadata.json
          test -s ota-dist/expoConfig.json

      - name: Package content-addressed OTA release
        working-directory: frontend
        run: |
          set -euo pipefail
          node scripts/prepare-ota-release.mjs ota-dist ota-release
          test -s ota-release/ota-source.json
          test -s ota-release/ota-source.sha256
          node -e "const s=require('./ota-release/ota-source.json');if(s.runtimeVersion!==require('./app.json').expo.runtimeVersion||!s.id||!s.launchAsset?.url)process.exit(1)"

      - name: Upload verification artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OnCampus-OTA-${{ needs.classify.outputs.runtime }}-verify
          path: frontend/ota-release/
          if-no-files-found: error
          retention-days: 7

      - name: Publish content-addressed OTA assets
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ota-runtime-${{ needs.classify.outputs.runtime }}
          name: OnCampus OTA Runtime ${{ needs.classify.outputs.runtime }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Signed production OTA assets for OnCampus runtime ${{ needs.classify.outputs.runtime }}.
            The live update pointer is promoted atomically through the production backend.
          files: frontend/ota-release/*

      - name: Wait for resilient production asset relay and APK signature contract
        if: github.event_name != 'pull_request'
        env:
          RUNTIME_VERSION: ${{ needs.classify.outputs.runtime }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL="${OTA_API_BASE}/updates/manifest"
          READY="false"
          for attempt in $(seq 1 60); do
            HTTP_CODE=$(curl -sS --connect-timeout 5 --max-time 20 \
              -D /tmp/preflight-manifest-headers.txt \
              -o /tmp/preflight-manifest.json \
              -w '%{http_code}' \
              -H 'expo-protocol-version: 1' \
              -H 'expo-platform: android' \
              -H "expo-runtime-version: ${RUNTIME_VERSION}" \
              -H 'expo-expect-signature: sig, keyid="oncampus-main", alg="rsa-v1_5-sha256"' \
              -H 'Accept: application/expo+json,application/json' \
              "$MANIFEST_URL" || true)

            # Do not depend on field order or proxy whitespace. Security still
            # requires a quoted SFV StringItem and explicitly rejects the old
            # byte-sequence form that Android expo-updates cannot parse.
            if [ "$HTTP_CODE" = "200" ] \
              && grep -Eqi '^expo-signature:.*sig="[^"]+"' /tmp/preflight-manifest-headers.txt \
              && ! grep -Eqi '^expo-signature:.*sig=:' /tmp/preflight-manifest-headers.txt \
              && grep -Eqi '^expo-signature:.*keyid="oncampus-main"' /tmp/preflight-manifest-headers.txt \
              && grep -Eqi '^expo-signature:.*alg="rsa-v1_5-sha256"' /tmp/preflight-manifest-headers.txt; then
              ASSET_URL=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/preflight-manifest.json','utf8'));process.stdout.write(String(j.launchAsset?.url||''))}catch{}")
              case "$ASSET_URL" in
                "${OTA_API_BASE}/updates/assets/"*)
                  RANGE_CODE=$(curl -sS --connect-timeout 5 --max-time 60 \
                    -D /tmp/preflight-asset-headers.txt \
                    -o /tmp/preflight-asset.bin \
                    -w '%{http_code}' \
                    -H 'Range: bytes=0-1023' \
                    "$ASSET_URL" || true)
                  if [ "$RANGE_CODE" = "206" ] && grep -qi '^content-range: bytes 0-' /tmp/preflight-asset-headers.txt && grep -qi '^accept-ranges: bytes' /tmp/preflight-asset-headers.txt; then
                    READY="true"
                    break
                  fi
                  ;;
              esac
            fi
            sleep 3
          done
          if [ "$READY" != "true" ]; then
            echo "Production backend did not expose the APK-compatible signed resumable OTA contract; refusing to promote a new update." >&2
            exit 1
          fi

          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const headers = fs.readFileSync('/tmp/preflight-manifest-headers.txt', 'utf8');
          const line = headers.split(/\r?\n/).find((value) => /^expo-signature:/i.test(value)) || '';
          if (/sig=:/i.test(line)) throw new Error('Production Expo-Signature still uses rejected SFV byte-sequence syntax');
          const signatureMatch = line.match(/(?:^|[,\s])sig="([^"]+)"/i);
          const keyIdMatch = line.match(/(?:^|[,\s])keyid="([^"]+)"/i);
          const algorithmMatch = line.match(/(?:^|[,\s])alg="([^"]+)"/i);
          if (!signatureMatch || keyIdMatch?.[1] !== 'oncampus-main' || algorithmMatch?.[1] !== 'rsa-v1_5-sha256') {
            throw new Error(`Production Expo-Signature fields are not APK-compatible: ${line.slice(0, 220)}`);
          }
          const body = fs.readFileSync('/tmp/preflight-manifest.json');
          const certificate = fs.readFileSync('frontend/certs/ota-certificate.pem');
          const signature = Buffer.from(signatureMatch[1], 'base64');
          if (!crypto.verify('RSA-SHA256', body, certificate, signature)) {
            throw new Error('Production manifest signature does not verify against the certificate embedded in the APK');
          }
          console.log('Production manifest signature verifies against the APK certificate.');
          NODE
          echo "Production OTA asset relay and APK signature contract are ready before promotion."

      - name: Obtain short-lived GitHub deployment identity
        if: github.event_name != 'pull_request'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS --connect-timeout 5 --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=oncampus-ota-promote")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.value)process.exit(1);process.stdout.write(j.value)})")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"

      - name: Atomically promote exact production OTA
        if: github.event_name != 'pull_request'
        working-directory: frontend
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUNTIME_VERSION: ${{ needs.classify.outputs.runtime }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('ota-release/ota-source.json', 'utf8'));
          const runtime = process.env.RUNTIME_VERSION;
          const token = process.env.OIDC_TOKEN;
          const base = process.env.OTA_API_BASE;
          if (!token || !base || source.runtimeVersion !== runtime || !source.id) {
            throw new Error('Invalid OTA promotion inputs');
          }
          (async () => {
            const response = await fetch(`${base}/updates/promote`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                Accept: 'application/json',
              },
              body: JSON.stringify({ source }),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`OTA promotion failed: ${response.status} ${text}`);
            const promoted = JSON.parse(text);
            if (!promoted.promoted || promoted.updateId !== source.id || promoted.runtimeVersion !== runtime) {
              throw new Error(`OTA promotion response mismatch: ${text}`);
            }
            console.log(`Promoted runtime=${runtime} update=${source.id} through production control plane`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify production OTA delivery end to end
        if: github.event_name != 'pull_request'
        working-directory: frontend
        env:
          RUNTIME_VERSION: ${{ needs.classify.outputs.runtime }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_ID=$(node -e "const s=require('./ota-release/ota-source.json'); process.stdout.write(String(s.id))")
          STATUS_URL="${OTA_API_BASE}/updates/status?runtimeVersion=${RUNTIME_VERSION}"
          MANIFEST_URL="${OTA_API_BASE}/updates/manifest"

          VERIFIED="false"
          for attempt in $(seq 1 20); do
            STATUS=$(curl -fsS --connect-timeout 5 --max-time 15 "$STATUS_URL" || true)
            if [ -n "$STATUS" ]; then
              ACTUAL_ID=$(printf '%s' "$STATUS" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);process.stdout.write(j.releaseAvailable ? String(j.updateId||'') : '')}catch{}})")
              if [ "$ACTUAL_ID" = "$EXPECTED_ID" ]; then
                VERIFIED="true"
                break
              fi
            fi
            sleep 3
          done

          if [ "$VERIFIED" != "true" ]; then
            echo "Production OTA status never exposed promoted update $EXPECTED_ID for runtime $RUNTIME_VERSION" >&2
            exit 1
          fi

          HTTP_CODE=$(curl -sS --connect-timeout 5 --max-time 20 \
            -D /tmp/ota-headers.txt \
            -o /tmp/ota-manifest.json \
            -w '%{http_code}' \
            -H 'expo-protocol-version: 1' \
            -H 'expo-platform: android' \
            -H "expo-runtime-version: ${RUNTIME_VERSION}" \
            -H 'expo-expect-signature: sig, keyid="oncampus-main", alg="rsa-v1_5-sha256"' \
            -H 'Accept: application/expo+json,application/json' \
            "$MANIFEST_URL")

          test "$HTTP_CODE" = "200"
          grep -qi '^expo-signature:' /tmp/ota-headers.txt
          grep -qi '^expo-protocol-version: 1' /tmp/ota-headers.txt
          ACTUAL_MANIFEST_ID=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/ota-manifest.json','utf8'));process.stdout.write(String(j.id||''))")
          test "$ACTUAL_MANIFEST_ID" = "$EXPECTED_ID"

          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const headers = fs.readFileSync('/tmp/ota-headers.txt', 'utf8');
          const line = headers.split(/\r?\n/).find((value) => /^expo-signature:/i.test(value)) || '';
          if (/sig=:/i.test(line)) throw new Error('Live Expo-Signature uses rejected SFV byte-sequence syntax');
          const signatureMatch = line.match(/(?:^|[,\s])sig="([^"]+)"/i);
          const keyIdMatch = line.match(/(?:^|[,\s])keyid="([^"]+)"/i);
          const algorithmMatch = line.match(/(?:^|[,\s])alg="([^"]+)"/i);
          if (!signatureMatch || keyIdMatch?.[1] !== 'oncampus-main' || algorithmMatch?.[1] !== 'rsa-v1_5-sha256') {
            throw new Error(`Live Expo-Signature fields are not APK-compatible: ${line.slice(0, 220)}`);
          }
          const manifestBytes = fs.readFileSync('/tmp/ota-manifest.json');
          const certificate = fs.readFileSync('certs/ota-certificate.pem');
          if (!crypto.verify('RSA-SHA256', manifestBytes, certificate, Buffer.from(signatureMatch[1], 'base64'))) {
            throw new Error('Live manifest signature does not verify against the APK-embedded certificate');
          }

          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          const base = process.env.OTA_API_BASE;
          const assets = [manifest.launchAsset, ...(manifest.assets || [])].filter(Boolean);
          if (!assets.length) throw new Error('OTA manifest has no downloadable assets');
          if (assets.some((asset) => !String(asset.url || '').startsWith(`${base}/updates/assets/`))) {
            throw new Error('OTA manifest exposed a client asset outside the OnCampus relay');
          }

          async function verifyAsset(asset) {
            const response = await fetch(asset.url, { headers: { Accept: asset.contentType || 'application/octet-stream' } });
            if (!response.ok) throw new Error(`Asset download failed ${response.status}: ${asset.url}`);
            const declaredLength = Number(response.headers.get('content-length') || 0);
            const bytes = Buffer.from(await response.arrayBuffer());
            if (declaredLength && declaredLength !== bytes.length) {
              throw new Error(`Asset content-length mismatch: ${asset.url}`);
            }
            const digest = crypto.createHash('sha256').update(bytes).digest('base64url');
            if (digest !== asset.hash) throw new Error(`Asset SHA-256 mismatch: ${asset.url}`);
          }

          (async () => {
            const concurrency = 6;
            for (let index = 0; index < assets.length; index += concurrency) {
              await Promise.all(assets.slice(index, index + concurrency).map(verifyAsset));
            }
            const range = await fetch(manifest.launchAsset.url, { headers: { Range: 'bytes=0-1023' } });
            if (range.status !== 206 || !String(range.headers.get('content-range') || '').startsWith('bytes 0-')) {
              throw new Error('OTA launch asset does not support resumable byte ranges');
            }
            console.log(`Verified APK-compatible manifest signature and ${assets.length} OTA assets through the OnCampus relay.`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          echo "Production OTA verified: runtime=$RUNTIME_VERSION update=$EXPECTED_ID"
