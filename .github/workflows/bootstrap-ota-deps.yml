name: Bootstrap Expo OTA dependency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-ota-deps.yml"

permissions:
  contents: write

jobs:
  lock-expo-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install SDK 54 compatible expo-updates
        working-directory: frontend
        run: npm install expo-updates@~29.0.19 --save --legacy-peer-deps

      - name: Commit dependency lock
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "Dependency lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "Install expo-updates for signed OTA delivery"
          git push
