name: Finalize OTA and Installer 1.6.7 v2

on:
  push:
    branches: [ota-installer-final-1.6.7]
    paths:
      - '.github/workflows/ota-installer-finalize-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ota-installer-final-1.6.7
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply final OTA and installer fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('frontend')

          app_path = root / 'app.json'
          app = json.loads(app_path.read_text())
          expo = app['expo']
          expo['version'] = '1.6.7'
          expo['runtimeVersion'] = '1.6.7'
          expo['android']['versionCode'] = 10607
          expo['updates']['checkAutomatically'] = 'NEVER'
          expo['extra']['otaRuntimeVersion'] = '1.6.7'
          app_path.write_text(json.dumps(app, indent=2) + '\n')

          p = root / 'android/app/build.gradle'
          text = p.read_text()
          text = text.replace('?: "1.6.6"', '?: "1.6.7"').replace('?: "10606"', '?: "10607"')
          p.write_text(text)

          p = root / 'android/app/src/main/res/values/strings.xml'
          p.write_text(p.read_text().replace('>1.6.6</string>', '>1.6.7</string>'))

          p = root / 'android/app/src/main/AndroidManifest.xml'
          text = p.read_text().replace('EXPO_UPDATES_CHECK_ON_LAUNCH" android:value="ALWAYS"', 'EXPO_UPDATES_CHECK_ON_LAUNCH" android:value="NEVER"')
          restart = '    <activity android:name=".OnCampusOtaRestartActivity" android:exported="false" android:process=":ota_restart" android:excludeFromRecents="true" android:theme="@android:style/Theme.Translucent.NoTitleBar"/>\n'
          if restart not in text:
              anchor = '    <activity android:name=".MainActivity"'
              if anchor not in text: raise SystemExit('MainActivity manifest anchor missing')
              text = text.replace(anchor, restart + anchor)
          p.write_text(text)

          (root / 'DIRECT_APK_BUILD').write_text('version=1.6.7\nruntime=1.6.7\nversionCode=10607\nmode=direct-signed-apk\nrequested=2026-08-27T10:30:00+05:30\nsource=ota-installer-final\nskipColdLaunch=true\n')

          # Background OTA: production status discovers, expo-updates only fetches.
          p = root / 'src/updates/backgroundOta.ts'
          text = p.read_text()
          pattern = re.compile(r'async function fetchUpdateWithRetry\(expectedUpdateId: string\) \{.*?\n\}\n\nasync function runPrefetch', re.S)
          replacement = '''async function fetchUpdateWithRetry(expectedUpdateId: string) {
            let lastError: unknown = null;
            for (let attempt = 0; attempt < FETCH_ATTEMPTS; attempt += 1) {
              try {
                const fetched = await Updates.fetchUpdateAsync();
                const manifestId = String((fetched as any)?.manifest?.id || expectedUpdateId || "pending");
                if (expectedUpdateId && manifestId && manifestId !== expectedUpdateId) {
                  throw new Error(`OTA changed during download (${manifestId} != ${expectedUpdateId})`);
                }
                if (fetched.isNew || expectedUpdateId !== String(Updates.updateId || "")) {
                  await persistReady(expectedUpdateId || manifestId);
                  return true;
                }
                return false;
              } catch (error) {
                lastError = error;
                if (attempt < FETCH_ATTEMPTS - 1) await sleep(800 * 2 ** attempt);
              }
            }
            await persistFailure(lastError);
            return false;
          }

          async function runPrefetch'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1: raise SystemExit(f'background fetch replacement count={count}')
          if 'Updates.checkForUpdateAsync()' in text: raise SystemExit('background checkForUpdateAsync still present')
          p.write_text(text)

          # App gate: authoritative server discovery + isolated cold restart.
          p = root / 'src/components/AppUpdateGate.tsx'
          text = p.read_text()
          text = text.replace('const AUTOMATIC_CHECK_INTERVAL_MS = 10 * 60 * 1000;', 'const AUTOMATIC_CHECK_INTERVAL_MS = 60 * 1000;')
          if 'restartForOta:' not in text:
              text = text.replace('  startInstall: (url: string, sha256: string) => Promise<NativeInstallerResult>;\n', '  startInstall: (url: string, sha256: string) => Promise<NativeInstallerResult>;\n  restartForOta: () => Promise<NativeInstallerResult>;\n')

          pattern = re.compile(r'async function serverOtaId\(\) \{.*?\n\}\n\nasync function reconcileAppliedUpdate', re.S)
          replacement = '''async function serverOtaId(strict = false) {
            const runtime = currentRuntime();
            if (!runtime) {
              if (strict) throw new Error("This installation has no OTA runtime identity.");
              return null;
            }
            try {
              const response = await fetch(`${API_BASE}/updates/status?runtimeVersion=${encodeURIComponent(runtime)}`, {
                headers: { Accept: "application/json", "Cache-Control": "no-cache" },
              });
              if (!response.ok) throw new Error(`Update service returned ${response.status}`);
              const payload = await response.json() as { releaseAvailable?: boolean; updateId?: string | null };
              return payload.releaseAvailable && payload.updateId ? String(payload.updateId) : null;
            } catch {
              if (strict) throw new Error("Couldn’t reach the OnCampus update service. Check your connection and try again.");
              return null;
            }
          }

          async function reconcileAppliedUpdate'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1: raise SystemExit(f'server status replacement count={count}')

          pattern = re.compile(r'async function checkForOtaUpdate\(mode: UpdateCheckMode\): Promise<boolean> \{.*?\n\}\n\nasync function markOtaApply', re.S)
          replacement = '''async function checkForOtaUpdate(mode: UpdateCheckMode): Promise<boolean> {
            if (Platform.OS !== "android" || !Updates.isEnabled) return false;
            if (await showDownloadedPending(mode)) return true;

            const serverId = await serverOtaId(mode === "manual");
            if (!serverId || serverId === currentUpdateId()) return false;
            const releaseKey = `ota:${serverId}`;

            void prefetchLatestOta(true).catch(() => undefined);
            if (await isDeferred(releaseKey, mode)) return true;

            pendingOtaReleaseKey = releaseKey;
            emitUpdateUi({
              kind: "ota",
              phase: "available",
              progress: 0,
              releaseKey,
              message: "A new OnCampus update is ready",
              detail: "This signed production update matches your runtime. Download starts immediately and Android can continue retrying if you minimize OnCampus.",
            });
            return true;
          }

          async function markOtaApply'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1: raise SystemExit(f'OTA discovery replacement count={count}')

          old = '  await new Promise((resolve) => setTimeout(resolve, 120));\n  await Updates.reloadAsync();\n  return true;'
          new = '  await new Promise((resolve) => setTimeout(resolve, 120));\n  if (!nativeInstaller?.restartForOta) {\n    emitUpdateUi({ kind: "ota", phase: "error", progress: 100, releaseKey, message: "Update downloaded", detail: "Close OnCampus completely and reopen it to apply the downloaded update." });\n    return false;\n  }\n  await nativeInstaller.restartForOta();\n  return true;'
          if old not in text: raise SystemExit('reloadReadyOta activation anchor missing')
          text = text.replace(old, new)
          text = text.replace('timer = setTimeout(() => { void checkForAppUpdate("automatic"); }, 2200);', 'timer = setTimeout(() => { void checkForAppUpdate("automatic"); }, 900);')
          text = text.replace(': "Keep OnCampus open until the Android installer starts."}', ': "You can minimize OnCampus while Android downloads the APK. Return after it finishes and the verified Android installer will open automatically."}')
          if 'Updates.checkForUpdateAsync()' in text: raise SystemExit('AppUpdateGate checkForUpdateAsync still present')
          p.write_text(text)

          # Retry campaign prompts every live server poll; never mark them seen first.
          p = root / 'src/components/ServerUpdateCoordinator.tsx'
          text = p.read_text()
          text = re.sub(r'let currentCampaignInMemory: string \| null = null;\nlet currentCampaignTargetInMemory: string \| null = null;\nlet currentNativeReleaseInMemory: string \| null = null;\n', '', text, count=1)
          pattern = re.compile(r'    if \(campaign\.nativeUpdateAvailable && campaign\.nativeReleaseVersion\) \{.*?\n    await checkForAppUpdate\("campaign", true, true\);\n    return nextPollSeconds;', re.S)
          replacement = '''    if (campaign.nativeUpdateAvailable || (campaign.available && campaign.campaignId)) {
              await checkForAppUpdate("campaign", true, true);
            }
            return nextPollSeconds;'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1: raise SystemExit(f'campaign retry replacement count={count}')
          p.write_text(text)

          # Native updater: add isolated restart method and safer installer handoff.
          p = root / 'android/app/src/main/java/com/oncampus/app/OnCampusApkInstallerModule.kt'
          text = p.read_text()
          if 'import android.os.Handler' not in text:
              text = text.replace('import android.os.Environment\n', 'import android.os.Environment\nimport android.os.Handler\nimport android.os.Looper\nimport android.os.Process\n')
          if 'fun restartForOta(' not in text:
              method = '''  @ReactMethod
            fun restartForOta(promise: Promise) {
              if (!hostResumed) {
                promise.reject("APP_NOT_ACTIVE", "OnCampus must be active to apply the downloaded update")
                return
              }
              val intent = Intent(reactContext, OnCampusOtaRestartActivity::class.java).apply {
                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_NO_ANIMATION)
              }
              reactContext.runOnUiQueueThread {
                try {
                  reactContext.startActivity(intent)
                  promise.resolve(Arguments.createMap().apply { putString("status", "restarting") })
                  Handler(Looper.getMainLooper()).postDelayed({ Process.killProcess(Process.myPid()) }, 180L)
                } catch (error: Exception) {
                  promise.reject("OTA_RESTART_FAILED", error.message ?: "Unable to restart OnCampus", error)
                }
              }
            }

          '''
              anchor = '  private fun canInstallPackages(): Boolean {'
              if anchor not in text: raise SystemExit('restart method anchor missing')
              text = text.replace(anchor, method + anchor)
          text = text.replace('DownloadManager.Request.VISIBILITY_VISIBLE)', 'DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)')
          text = text.replace('    launchInstaller(apkFile)\n    clearPendingMetadata()\n', '    launchInstaller(apkFile)\n')
          pattern = re.compile(r'  private fun launchInstaller\(apkFile: File\) \{.*?\n  \}\n\n  private fun clearPendingMetadata', re.S)
          replacement = '''  private fun launchInstaller(apkFile: File) {
            val uri = FileProvider.getUriForFile(
              reactContext,
              "${reactContext.packageName}.apkprovider",
              apkFile
            )
            val intent = Intent(Intent.ACTION_VIEW).apply {
              setDataAndType(uri, "application/vnd.android.package-archive")
              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP)
            }
            if (intent.resolveActivity(reactContext.packageManager) == null) {
              emit("error", 100, "Android installer unavailable", "The APK is downloaded and verified, but Android could not resolve its package installer.")
              return
            }
            reactContext.runOnUiQueueThread {
              try {
                reactContext.startActivity(intent)
                clearPendingMetadata()
              } catch (error: Exception) {
                emit("error", 100, "Android installer could not open", error.message ?: "Return to OnCampus and try Install now again.")
              }
            }
          }

          private fun clearPendingMetadata'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1: raise SystemExit(f'installer launch replacement count={count}')
          p.write_text(text)

          # Release validator locks the regression fixes in place.
          p = root / 'scripts/validate-release-startup.js'
          text = p.read_text()
          text = text.replace("expect(app.updates?.checkAutomatically === 'ON_LOAD', 'Expo Updates must check natively on every cold launch');", "expect(app.updates?.checkAutomatically === 'NEVER', 'server-driven update discovery must not race native startup checks');")
          text = text.replace("expect(manifest.includes('EXPO_UPDATES_CHECK_ON_LAUNCH\" android:value=\"ALWAYS\"'), 'native manifest must enable automatic Expo update checks');", "expect(manifest.includes('EXPO_UPDATES_CHECK_ON_LAUNCH\" android:value=\"NEVER\"'), 'native manifest must disable concurrent startup update checks');")
          text = text.replace("expect(updateGate.includes('Updates.reloadAsync()'), 'OTA one-tap apply/reload step missing');", "expect(updateGate.includes('restartForOta'), 'isolated OTA cold-restart activation missing');\nexpect(!updateGate.includes('Updates.checkForUpdateAsync()'), 'manual/automatic UI must not depend on rejected Expo check promises');")
          text = text.replace("expect(!backgroundOta.includes('Updates.reloadAsync()'), 'background OTA worker must never reload the hidden app');", "expect(!backgroundOta.includes('Updates.reloadAsync()'), 'background OTA worker must never reload the hidden app');\nexpect(!backgroundOta.includes('Updates.checkForUpdateAsync()'), 'background OTA discovery must not depend on Expo check promises');")
          anchor = "expect(apkInstaller.includes('override fun onHostResume()'), 'native APK updater must resume verification/install when app returns');"
          addition = anchor + "\nexpect(apkInstaller.includes('restartForOta') && apkInstaller.includes('OnCampusOtaRestartActivity'), 'isolated OTA cold-restart bridge missing');\nexpect(apkInstaller.includes('VISIBILITY_VISIBLE_NOTIFY_COMPLETED'), 'background APK completion notification missing');\nexpect(manifest.includes('android:name=\".OnCampusOtaRestartActivity\"') && manifest.includes('android:process=\":ota_restart\"'), 'isolated restart activity manifest contract missing');"
          if anchor not in text: raise SystemExit('validator installer anchor missing')
          text = text.replace(anchor, addition)
          text = text.replace('with business-semantic reference UI, resilient background OTA and durable Android APK downloads', 'with server-driven OTA discovery, isolated cold-restart activation and verified Android installer handoff')
          p.write_text(text)
          PY
      - name: Install locked mobile dependencies
        working-directory: frontend
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Validate final update contracts
        working-directory: frontend
        run: |
          node scripts/audit-luxury-ui.js
          node scripts/validate-release-startup.js
          npx expo install --check
          npx tsc --noEmit
          npx expo export --platform android --output-dir /tmp/oncampus-android-export
      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git diff --cached --quiet && exit 0
          git commit -m "Fix OTA discovery and Android installer flow for 1.6.7"
          git push origin HEAD:ota-installer-final-1.6.7
