name: Sync Mobile Package Lock

on:
  push:
    branches: [main]
    paths:
      - "frontend/PACKAGE_LOCK_SYNC"
  workflow_dispatch:

concurrency:
  group: oncampus-mobile-lockfile-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile from pinned package.json
        env:
          NODE_ENV: development
        run: |
          set -euo pipefail
          npm install --package-lock-only --include=dev --legacy-peer-deps --no-audit --no-fund
          npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
          npx expo install --check
          npx tsc --noEmit

      - name: Commit synchronized lockfile
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(mobile): synchronize package lock"
          git pull --rebase origin main
          git push origin HEAD:main
