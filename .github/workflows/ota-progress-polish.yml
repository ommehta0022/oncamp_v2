name: OTA Progress Polish

on:
  push:
    branches: [ota-progress-reliability-1.6.8]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_API_URL: https://oncampus-backend-production.up.railway.app/v1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ota-progress-reliability-1.6.8
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Polish, validate, and commit
        run: |
          if git log -1 --pretty=%B | grep -Fq '[polish-applied]'; then
            echo 'Polish already applied.'
            exit 0
          fi
          python <<'PY'
          from pathlib import Path

          root = Path('.')
          def read(p): return (root / p).read_text(encoding='utf-8')
          def write(p, s): (root / p).write_text(s, encoding='utf-8')
          def one(s, old, new, label):
              n = s.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return s.replace(old, new, 1)

          p = 'frontend/src/components/AppUpdateGate.tsx'
          s = read(p)
          s = one(s,
              'let pendingNativeRelease: NativeRelease | null = null;\n',
              'let pendingNativeRelease: NativeRelease | null = null;\nlet lastOtaProgress = 0;\n',
              'last OTA progress state')
          s = one(s,
              '    detail: "Download starts automatically in the background. You can keep using OnCampus and choose when to restart after it reaches 100%.",',
              '    detail: "Tap Download update to start the signed transfer. You can keep using OnCampus while it downloads, then choose when to restart.",',
              'available copy')
          s = one(s,
              '  pendingOtaReleaseKey = releaseKey;\n  emitUpdateUi({\n    kind: "ota",\n    phase: "available",',
              '  pendingOtaReleaseKey = releaseKey;\n  lastOtaProgress = 0;\n  emitUpdateUi({\n    kind: "ota",\n    phase: "available",',
              'reset progress on discovery')
          s = one(s,
              'async function downloadOtaUpdate(releaseKey: string) {\n  await clearDeferral(releaseKey);\n  pendingOtaReleaseKey = releaseKey;\n',
              'async function downloadOtaUpdate(releaseKey: string) {\n  await clearDeferral(releaseKey);\n  pendingOtaReleaseKey = releaseKey;\n  lastOtaProgress = 0;\n',
              'reset progress on download')
          s = one(s,
              '        phase: "error",\n        progress: 0,\n        releaseKey,\n        message: "Download paused",',
              '        phase: "error",\n        progress: lastOtaProgress,\n        releaseKey,\n        message: "Download paused",',
              'failed retry progress')
          s = one(s,
              '      phase: "error",\n      progress: 0,\n      releaseKey,\n      message: "Update download paused",',
              '      phase: "error",\n      progress: lastOtaProgress,\n      releaseKey,\n      message: "Update download paused",',
              'caught failure progress')
          s = one(s,
              '    downloadedPendingKey = releaseKey;\n    pendingOtaReleaseKey = releaseKey;\n    emitUpdateUi({',
              '    downloadedPendingKey = releaseKey;\n    pendingOtaReleaseKey = releaseKey;\n    lastOtaProgress = 100;\n    emitUpdateUi({',
              'ready progress')
          s = one(s,
              '    if (["checking", "available", "current"].includes(state.phase)) return 0;\n    if (state.phase === "downloading") return 1;\n    if (["ready", "verifying", "permission"].includes(state.phase)) return 2;\n    if (["installing", "applied"].includes(state.phase)) return 3;\n    if (state.phase === "error") return state.progress >= 100 ? 2 : state.progress > 0 ? 1 : 0;',
              '    if (["checking", "current"].includes(state.phase)) return 0;\n    if (["available", "downloading"].includes(state.phase)) return 1;\n    if (state.phase === "verifying") return 2;\n    if (["ready", "permission", "installing", "applied"].includes(state.phase)) return 3;\n    if (state.phase === "error") return state.progress >= 100 ? 3 : state.progress > 0 ? 1 : 0;',
              'stage semantics')
          s = one(s,
              'width: (String(Math.max(2, Math.min(100, state.progress || 2))) + "%") as `${number}%`',
              'width: (String(state.progress <= 0 ? 0 : Math.max(2, Math.min(100, state.progress))) + "%") as `${number}%`',
              'zero progress width')
          s = one(s,
              'if (previous.kind !== "ota" || !["available", "downloading"].includes(previous.phase)) return previous;\n      const nextPercent = Math.max(previous.progress || 0, percent);',
              'if (previous.kind !== "ota" || !["available", "downloading", "error"].includes(previous.phase)) return previous;\n      const nextPercent = Math.max(lastOtaProgress, previous.progress || 0, percent);\n      lastOtaProgress = nextPercent;',
              'retry progress resume')
          write(p, s)

          p = 'frontend/android/app/src/main/java/com/oncampus/app/OnCampusApkInstallerModule.kt'
          s = read(p)
          s = one(s,
              '        emit("verifying", 90, "Verifying update", "Checking the completed APK before Android can install it…")',
              '        emit("verifying", 100, "Verifying update", "Download complete • checking the APK before Android can install it…")',
              'verification progress')
          write(p, s)

          p = 'frontend/scripts/validate-release-startup.js'
          s = read(p)
          anchor = "expect(updateGate.includes('Automatic checks never hide or replace an active update UI'), 'automatic update failures must never dismiss active progress UI');"
          replacement = anchor + "\nexpect(updateGate.includes('lastOtaProgress') && updateGate.includes('[\\\"available\\\", \\\"downloading\\\", \\\"error\\\"]'), 'OTA retries must preserve and resume real visible progress');"
          s = one(s, anchor, replacement, 'progress persistence validator')
          write(p, s)
          PY
          cd frontend
          npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
          node scripts/audit-luxury-ui.js
          node scripts/validate-release-startup.js
          npx expo install --check
          npx tsc --noEmit
          cd ..
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "[polish-applied] Keep OTA progress stable through retries and verification"
          git push origin HEAD:ota-progress-reliability-1.6.8
