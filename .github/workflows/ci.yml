name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: oncampus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://oncampus-backend-production.up.railway.app/v1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run complete backend and security regression suite
        run: python -m pytest -q

      - name: Compile production backend
        run: python -m compileall -q server.py production_server.py institution_content_workflow.py campus_platform.py campus_platform_hardening.py campus_ops_extension.py campus_ai.py campus_semantics.py campus_media.py campus_voice.py ota_updates.py update_campaign.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked mobile dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Type-check mobile app
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Validate production Android JS bundle
        working-directory: frontend
        run: npx expo export --platform android --output-dir /tmp/oncampus-ci-android

      - name: Validate production iOS JS bundle
        working-directory: frontend
        run: npx expo export --platform ios --output-dir /tmp/oncampus-ci-ios

      - name: Install admin panel dependencies
        working-directory: admin-panel
        run: npm install

      - name: Build Next.js Admin Panel
        working-directory: admin-panel
        run: npm run build
