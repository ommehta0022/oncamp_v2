name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: oncampus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://oncampus-backend-production.up.railway.app/v1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend and security regression tests
        run: python -m pytest -q tests/test_auth_and_latency.py tests/test_institution_content_workflow.py

      - name: Compile production backend entry points
        run: python -m py_compile server.py production_server.py institution_content_workflow.py ota_updates.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked mobile dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Validate production Android JS bundle
        working-directory: frontend
        run: npx expo export --platform android --output-dir /tmp/oncampus-ci-export

      - name: Install admin panel dependencies
        working-directory: admin-panel
        run: npm install

      - name: Build Next.js Admin Panel
        working-directory: admin-panel
        run: npm run build
